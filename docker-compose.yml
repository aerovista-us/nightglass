services:
  nightglass:
    build: .
    container_name: nightglass
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      ENGINE_MODE: ${ENGINE_MODE:-live}
      SPIDERFOOT_URL: http://spiderfoot:5001
      SHADOWBROKER_ENABLED: ${SHADOWBROKER_ENABLED:-false}
      SHADOWBROKER_URL: ${SHADOWBROKER_URL:-http://shadowbroker:8000}
      SHADOWBROKER_HMAC_SECRET: ${SHADOWBROKER_HMAC_SECRET:-}
      SHADOWBROKER_TIMEOUT_MS: ${SHADOWBROKER_TIMEOUT_MS:-15000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      RECORDS_TIMEOUT_MS: ${RECORDS_TIMEOUT_MS:-15000}
      CAPTURE_WORKER_URL: ${CAPTURE_WORKER_URL:-http://capture-worker:8090}
      CAPTURE_WORKER_TOKEN: ${CAPTURE_WORKER_TOKEN:-}
      CAPTURE_CLIENT_TIMEOUT_MS: ${CAPTURE_CLIENT_TIMEOUT_MS:-30000}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-120000}
    ports:
      - "127.0.0.1:${NIGHTGLASS_PORT:-3088}:3000"
    volumes:
      - nightglass-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  shadowbroker:
    profiles: ["signal"]
    image: ${SHADOWBROKER_IMAGE:-ghcr.io/bigbodycobain/shadowbroker-backend:latest}
    container_name: nightglass-shadowbroker
    restart: unless-stopped
    environment:
      OPENCLAW_HMAC_SECRET: ${SHADOWBROKER_HMAC_SECRET:-}
      ADMIN_KEY: ${SHADOWBROKER_ADMIN_KEY:-}
      MESH_INFONET_FLEET_JOIN: "false"
      MESH_INFONET_ALLOW_CLEARNET_SYNC: "false"
      MESH_ARTI_ENABLED: "false"
      MESH_MQTT_ENABLED: "false"
      APRS_IS_ENABLED: "false"
      PREDICTION_MARKETS_ENABLED: "false"
      FINANCIAL_ENABLED: "false"
      CROWDTHREAT_ENABLED: "false"
      FIMI_ENABLED: "false"
      NUFORC_ENABLED: "false"
      NEWS_ENABLED: "false"
      XQUIK_ENABLED: "false"
      TELEGRAM_OSINT_ENABLED: "false"
      GT_ANALYTICS_ENABLED: "false"
      SHADOWBROKER_TRUST_DOCKER_BRIDGE_LOCAL_OPERATOR: "0"
    expose:
      - "8000"
    volumes:
      - shadowbroker-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  capture-worker:
    profiles: ["capture"]
    build:
      context: .
      dockerfile: capture-worker/Dockerfile
    container_name: nightglass-capture-worker
    restart: unless-stopped
    environment:
      CAPTURE_HOST: 0.0.0.0
      CAPTURE_PORT: 8090
      CAPTURE_DIR: /captures
      CAPTURE_WORKER_TOKEN: ${CAPTURE_WORKER_TOKEN:-}
      CAPTURE_TIMEOUT_MS: ${CAPTURE_TIMEOUT_MS:-15000}
      CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-5242880}
      CAPTURE_MAX_REDIRECTS: ${CAPTURE_MAX_REDIRECTS:-4}
    expose:
      - "8090"
    volumes:
      - nightglass-captures:/captures
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  spiderfoot:
    profiles: ["spiderfoot"]
    build:
      context: https://github.com/smicallef/spiderfoot.git#0f815a203afebf05c98b605dba5cf0475a0ee5fd
    container_name: nightglass-spiderfoot
    restart: unless-stopped
    expose:
      - "5001"
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    security_opt:
      - no-new-privileges:true

volumes:
  nightglass-data:
  nightglass-captures:
  shadowbroker-data:
  spiderfoot-data:
